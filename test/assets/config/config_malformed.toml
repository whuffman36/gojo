[project]
name = "example"
language = "C++"
target = "binary"

[build]
language_standard = 24
compiler = "clang++"
compiler_flags = ["example", "compiler", "flags"]
gnu_extensions_enabled = true
build_system = "CMake"
generator = "Ninja"
build_type = "Debug"

[checks]
clang_format_style = "none"
language_server = "clangd"
clang_tidy_enabled = true
clang_tidy_args = ["example", "clang-tidy", "args"]
cppcheck_enabled = true
cppcheck_checks = ["example", "checks"]
cppcheck_args = ["example", "cppcheck", "args"]

[tests]
testing_enabled = true
test_framework = "GoogleTest"

[dependencies]
package_manager = "Conan"
build_types = []