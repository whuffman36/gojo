name: Publish Cross-Platform Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a version tag like v1.0.0

jobs:
  build_and_release:
    name: Build Asset
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Define the distinct environments you need to build on
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            compiler: g++-14
            artifact_name: gojo
          - os: macos-latest
            compiler: clang++
            artifact_name: gojo

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Updated gcc
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y g++-14

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wconversion -Wshadow -fno-exceptions -s"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -S ${{ github.workspace }}

      - name: Build Application
        run: cmake --build ${{ github.workspace }}/build --config Release --parallel

      # Automatically uploads assets into the exact same release tag
      - name: Upload OS Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
