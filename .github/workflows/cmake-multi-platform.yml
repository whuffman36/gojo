# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: CMake Build
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following configurations:
      # 1. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 2. <MacOS, Release, latest Apple-Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      #
      # Default linux clang does not play nice with the gcc stdlib, resulting in some features of
      # C++23 not being available without custom tweaking or manually setting the stdlib. I think it's
      # okay to just compile with the default compilers of each system (gcc for linux, apple-clang
      # for macos, msvc for windows) because I am building with clang locally.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        include:
          - os: ubuntu-latest
            compiler: g++-16
            arch: amd64
          - os: ubuntu-latest
            compiler: g++-16
            arch: arm64
          - os: macos-latest
            compiler: clang++
            arch: arm64
        exclude:
          # TODO: Add Windows support
          - os: windows-latest
          - os: macos-latest
            arch: amd64

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Static Analyzers (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y clang-tidy clang-tools cppcheck clang-format

    - name: Install Static Analyzers (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm cppcheck clang-format
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix llvm)/share/clang/run-clang-tidy.py" >> $GITHUB_PATH

    - name: Install Updated GCC (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -y g++-16 build-essential

    - name: Set Up Conan Client
      uses: conan-io/setup-conan@v1

    - name: Install Conan Dependencies
      run: >
        conan install .
        --deployer=full_deploy
        --output-folder=./deps
        --build=missing
        --profile=default
        -s build_type=Release
        -s compiler.cppstd=23

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ github.workspace }}/build/Release
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        -DCMAKE_CXX_STANDARD=23
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wconversion -Wshadow -std=c++23"
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=deps/build/Release/generators/conan_toolchain.cmake
        -DBUILD_TESTING=ON
        -S ${{ github.workspace }}

    - name: Build Application
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ github.workspace }}/build/Release --config Release

    - name: Check With Static Analyzers
      # For some reason clang-tidy tries analyzing the std lib on linux, this only passes on macOS.
      if: runner.os == 'macOS'
      run: run-clang-tidy -p ${{ github.workspace }}/build/Release -extra-arg=-Wno-unknown-warning-option -extra-arg=-Wno-gcc-compat

    - name: Test Application
      working-directory: ${{ github.workspace }}/build/Release/test
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --output-on-failure --build-config Release
